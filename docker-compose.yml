services:
  # Constrói a imagem do sandbox; o backend cria containers dela sob demanda
  sandbox-image:
    build: ./sandbox
    image: frederico-ai-sandbox:latest
    command: ["true"]
    restart: "no"

  # Banco de dados PostgreSQL (substitui o SQLite anterior).
  # A imagem pgvector/pgvector inclui a extensão de busca vetorial: a busca
  # semântica das memórias roda no banco (índice HNSW) em vez de carregar tudo
  # na RAM do Node. Se voltar para postgres:16 puro, nada quebra — o backend
  # detecta a ausência da extensão e usa o fallback em JS.
  # ATENÇÃO (volume antigo do postgres:16-alpine): esta imagem é Debian (glibc);
  # após o primeiro boot com dados existentes, rode uma vez
  #   docker compose exec postgres psql -U studio -d studio -c 'REINDEX DATABASE studio;'
  # para realinhar índices de texto à collation da nova libc.
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=studio
      - POSTGRES_PASSWORD=studio
      - POSTGRES_DB=studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Antivírus (OPCIONAL no uso local — em produção ele fica ligado por padrão,
  # veja docker-compose.prod.yml). Para testar no PC:
  #   1) docker compose --profile antivirus up -d
  #   2) adicione CLAMAV_HOST=clamav no .env
  # Usa ~1–1,5 GB de RAM e baixa as assinaturas no primeiro boot (~5 min).
  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav

  # Serviço dedicado do Docling — compreensão documental (layout, tabelas, OCR).
  # PERMANENTE (modelos carregados uma vez) e acessível SOMENTE pela rede interna
  # do Docker: repare que NÃO há `ports:` — nada é publicado no host. O backend
  # o alcança por http://docling-service:8000. Ative com DOCLING_ENABLED=true.
  docling-service:
    build: ./docling-service
    profiles: ["docling"]
    restart: unless-stopped
    environment:
      - DOCLING_INTERNAL_TOKEN=${DOCLING_INTERNAL_TOKEN:-}
      - DOCLING_CONCURRENCY=${DOCLING_CONCURRENCY:-2}
      - DOCLING_MAX_FILE_MB=${DOCLING_MAX_FILE_MB:-50}
      - DOCLING_MAX_PAGES=${DOCLING_MAX_PAGES:-600}
      - DOCLING_ARTIFACTS_PATH=/models
    volumes:
      - docling_models:/models
    # Limites de memória/CPU (o modelo é pesado; ajuste conforme o servidor).
    mem_limit: ${DOCLING_MEM_LIMIT:-4g}
    cpus: ${DOCLING_CPUS:-2}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # GUARDA DO DOCKER — o único container que enxerga /var/run/docker.sock.
  # Fecha o achado F-04 da auditoria: antes o backend detinha o socket, e uma RCE
  # no Node viraria root no host (basta criar um container privilegiado com "/"
  # montado). Agora o backend fala HTTP com este serviço, que valida CADA
  # requisição — allowlist de rotas, inspeção do CORPO de /containers/create
  # (Privileged, binds, capabilities, imagem, cotas) e posse por label.
  # Sem `ports`: alcançável só pela rede interna do compose.
  # Ver docs/SECURITY.md §4.
  docker-guard:
    build:
      context: .
      dockerfile: docker-guard/Dockerfile
    environment:
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-frederico-ai-sandbox:latest}
      # Raiz PERMITIDA para os binds, no caminho do HOST (o daemon interpreta
      # binds como caminhos do host). Precisa casar com HOST_WORKSPACE_ROOT.
      - GUARD_WORKSPACE_ROOT=${PWD}/workspaces
      # "Pastas do PC" montam caminhos fora do workspace. Numa VPS pública fica
      # desligado; em instalação pessoal, ligue AQUI também (a blocklist de
      # /etc, /proc, docker.sock etc. continua valendo em qualquer caso).
      - GUARD_ALLOW_PC_FOLDERS=${GUARD_ALLOW_PC_FOLDERS:-false}
      - GUARD_EXTRA_BIND_ROOTS=${GUARD_EXTRA_BIND_ROOTS:-}
      - GUARD_MAX_MEMORY_MB=${GUARD_MAX_MEMORY_MB:-8192}
      - GUARD_MAX_CPUS=${GUARD_MAX_CPUS:-4}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2375/_ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # Caminho DENTRO do container do backend
      - WORKSPACE_ROOT=/app/workspaces
      # Caminho NO HOST do mesmo diretório — usado nos binds dos sandboxes.
      # Docker interpreta binds como caminhos do host, não do container.
      - HOST_WORKSPACE_ROOT=${PWD}/workspaces
      # Diretório de dados (cache de embeddings, inbox) — no volume montado
      - DATA_DIR=/app/data
      # Conexão com o Postgres (serviço acima, na rede do Docker)
      - DATABASE_URL=postgres://studio:studio@postgres:5432/studio
      # Docling (camada de documentos). Desligado por padrão — ligue com true.
      - DOCLING_ENABLED=${DOCLING_ENABLED:-false}
      - DOCLING_SERVICE_URL=http://docling-service:8000
      - DOCLING_INTERNAL_TOKEN=${DOCLING_INTERNAL_TOKEN:-}
      - DOCLING_CACHE_ROOT=/app/data/docling-cache
      # Todo acesso ao Docker passa pelo guarda validador (ver F-04).
      - DOCKER_HOST=tcp://docker-guard:2375
    volumes:
      # SEM /var/run/docker.sock: o backend não fala com o daemon direto (F-04).
      - ./workspaces:/app/workspaces
      - ./data:/app/data
    depends_on:
      docker-guard:
        condition: service_started
      sandbox-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      # node com fetch nativo (a imagem não tem curl/wget)
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      # Sem VITE_API_URL: o app usa a mesma origem e o Vite repassa /api ao
      # backend (veja vite.config.js). Assim funciona no PC, na rede e via
      # Tailscale/HTTPS. O alvo do proxy é o serviço 'backend' na rede do Docker.
      - VITE_PROXY_TARGET=http://backend:3001

volumes:
  pgdata:
  clamav_db:
  docling_models:
