services:
  # Constrói a imagem do sandbox; o backend cria containers dela sob demanda
  sandbox-image:
    build: ./sandbox
    image: frederico-ai-sandbox:latest
    command: ["true"]
    restart: "no"

  # Banco de dados PostgreSQL (substitui o SQLite anterior).
  # A imagem pgvector/pgvector inclui a extensão de busca vetorial: a busca
  # semântica das memórias roda no banco (índice HNSW) em vez de carregar tudo
  # na RAM do Node. Se voltar para postgres:16 puro, nada quebra — o backend
  # detecta a ausência da extensão e usa o fallback em JS.
  # ATENÇÃO (volume antigo do postgres:16-alpine): esta imagem é Debian (glibc);
  # após o primeiro boot com dados existentes, rode uma vez
  #   docker compose exec postgres psql -U studio -d studio -c 'REINDEX DATABASE studio;'
  # para realinhar índices de texto à collation da nova libc.
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=studio
      - POSTGRES_PASSWORD=studio
      - POSTGRES_DB=studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Antivírus (OPCIONAL no uso local — em produção ele fica ligado por padrão,
  # veja docker-compose.prod.yml). Para testar no PC:
  #   1) docker compose --profile antivirus up -d
  #   2) adicione CLAMAV_HOST=clamav no .env
  # Usa ~1–1,5 GB de RAM e baixa as assinaturas no primeiro boot (~5 min).
  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav

  backend:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # Caminho DENTRO do container do backend
      - WORKSPACE_ROOT=/app/workspaces
      # Caminho NO HOST do mesmo diretório — usado nos binds dos sandboxes.
      # Docker interpreta binds como caminhos do host, não do container.
      - HOST_WORKSPACE_ROOT=${PWD}/workspaces
      # Diretório de dados (cache de embeddings, inbox) — no volume montado
      - DATA_DIR=/app/data
      # Conexão com o Postgres (serviço acima, na rede do Docker)
      - DATABASE_URL=postgres://studio:studio@postgres:5432/studio
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspaces:/app/workspaces
      - ./data:/app/data
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      # node com fetch nativo (a imagem não tem curl/wget)
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      # Sem VITE_API_URL: o app usa a mesma origem e o Vite repassa /api ao
      # backend (veja vite.config.js). Assim funciona no PC, na rede e via
      # Tailscale/HTTPS. O alvo do proxy é o serviço 'backend' na rede do Docker.
      - VITE_PROXY_TARGET=http://backend:3001

volumes:
  pgdata:
  clamav_db:
