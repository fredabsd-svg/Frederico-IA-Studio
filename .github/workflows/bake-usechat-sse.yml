name: Bake useChat SSE fixes into source

# Grava AbortController/fromSeq no fonte — MCP não republica useChat.js (~43 KB).
# Depois do merge, este workflow pode ser removido.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'frontend/scripts/apply-usechat-sse-fixes.mjs'
      - '.github/workflows/bake-usechat-sse.yml'

permissions:
  contents: write

jobs:
  bake:
    if: github.head_ref == 'review/dev-wiring-readme' || github.ref_name == 'review/dev-wiring-readme'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply useChat SSE fixes to source
        run: node frontend/scripts/apply-usechat-sse-fixes.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- frontend/src/hooks/useChat.js; then
            echo "useChat.js already has SSE fixes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/hooks/useChat.js
          git commit -m "fix(frontend): grava AbortController/fromSeq no useChat fonte"
          git push
