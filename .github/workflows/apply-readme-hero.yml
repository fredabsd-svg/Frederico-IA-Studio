name: Aplicar hero do README
on:
  workflow_dispatch:
  push:
    branches: [review/dev-wiring-readme]
    paths:
      - frontend/scripts/apply-readme-hero.mjs
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/dev-wiring-readme
      - run: node frontend/scripts/apply-readme-hero.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: README hero honesto (badge amarelo + bullets reais)"
          git push
