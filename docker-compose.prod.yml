# PRODUÇÃO (VPS): docker compose -f docker-compose.prod.yml up -d --build
# Requer no .env (veja VPS-DEPLOY.md):
#   DOMAIN=seu.dominio.com.br
#   BETTER_AUTH_URL=https://seu.dominio.com.br
#   BETTER_AUTH_SECRET=<openssl rand -hex 32>
#   ENCRYPTION_KEY=<openssl rand -hex 32>
#   DEEPSEEK_API_KEY / DEEPSEEK_BASE_URL / DEEPSEEK_MODEL  (chave do servidor, opcional se BYOK)
#   ALLOW_SHARED_KEY=false  (recomendado num site público: cada usuário usa a própria chave)
#   GITHUB_/GOOGLE_ OAuth (opcional; e-mail+senha funciona sem eles)
# O acesso agora é por LOGIN DE USUÁRIO (Better Auth) — não existe mais APP_PASSWORD.
services:
  sandbox-image:
    build: ./sandbox
    image: frederico-ai-sandbox:latest
    command: ["true"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=studio
      - POSTGRES_PASSWORD=studio
      - POSTGRES_DB=studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Antivírus: escaneia todo arquivo enviado pelos usuários antes de o backend
  # salvar (ClamAV, gratuito e open source). No primeiro boot ele baixa a base
  # de assinaturas (~5 min); nesse meio-tempo os uploads seguem funcionando sem
  # verificação (fail-open), a menos que CLAMAV_REQUIRED=true no .env.
  # ATENÇÃO: usa ~1–1,5 GB de RAM. Em VPS de 2 GB, prefira 4 GB — ou desative
  # colocando CLAMAV_HOST= (vazio) no .env e removendo este serviço.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav # assinaturas persistidas entre reinícios

  backend:
    build: .
    restart: unless-stopped
    # SEM "ports": o backend só é alcançável pelo proxy (web), nunca direto.
    env_file:
      - .env
    environment:
      - WORKSPACE_ROOT=/app/workspaces
      - HOST_WORKSPACE_ROOT=${PWD}/workspaces
      - DATA_DIR=/app/data
      - DATABASE_URL=postgres://studio:studio@postgres:5432/studio
      # Antivírus ligado por padrão (serviço 'clamav' acima). Para desativar,
      # defina CLAMAV_HOST= (vazio) no .env.
      - CLAMAV_HOST=${CLAMAV_HOST-clamav}
      # Origem pública do app: base dos cookies de sessão e dos callbacks OAuth.
      # Se não estiver no .env, é derivada do DOMAIN (https://SEU_DOMINIO).
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://${DOMAIN}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspaces:/app/workspaces
      - ./data:/app/data
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}
      # Com DOMAIN definido vira "www.DOMAIN" (certificado + redirect no Caddy);
      # sem DOMAIN vira "localhost:8099" (bloco inerte, porta não exposta).
      - WWW_DOMAIN=${DOMAIN:+www.}${DOMAIN:-localhost:8099}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  clamav_db:
