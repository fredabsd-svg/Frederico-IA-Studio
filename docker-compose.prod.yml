# PRODUÇÃO (VPS): docker compose -f docker-compose.prod.yml up -d --build
# Requer no .env (veja VPS-DEPLOY.md):
#   DOMAIN=seu.dominio.com.br
#   BETTER_AUTH_URL=https://seu.dominio.com.br
#   BETTER_AUTH_SECRET=<openssl rand -hex 32>
#   ENCRYPTION_KEY=<openssl rand -hex 32>
#   As chaves de IA são cadastradas e validadas por usuário dentro do aplicativo.
#   FREE_TIER_API_KEY é opcional, somente para o modo gratuito patrocinado.
#   GITHUB_/GOOGLE_ OAuth (opcional; e-mail+senha funciona sem eles)
# O acesso agora é por LOGIN DE USUÁRIO (Better Auth) — não existe mais APP_PASSWORD.
services:
  sandbox-image:
    build: ./sandbox
    image: frederico-ai-sandbox:latest
    command: ["true"]
    restart: "no"

  # A imagem pgvector/pgvector traz a extensão de busca vetorial (memórias
  # buscadas no banco com índice HNSW, sem carregar tudo na RAM do Node).
  # ATENÇÃO (volume antigo do postgres:16-alpine): esta imagem é Debian (glibc);
  # após o primeiro boot com dados existentes, rode uma vez
  #   docker compose -f docker-compose.prod.yml exec postgres psql -U studio -d studio -c 'REINDEX DATABASE studio;'
  # para realinhar índices de texto à collation da nova libc.
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=studio
      - POSTGRES_PASSWORD=studio
      - POSTGRES_DB=studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Antivírus: escaneia todo arquivo enviado pelos usuários antes de o backend
  # salvar (ClamAV, gratuito e open source). No primeiro boot ele baixa a base
  # de assinaturas (~5 min); nesse meio-tempo os uploads seguem funcionando sem
  # verificação (fail-open), a menos que CLAMAV_REQUIRED=true no .env.
  # ATENÇÃO: usa ~1–1,5 GB de RAM. Em VPS de 2 GB, prefira 4 GB — ou desative
  # colocando CLAMAV_HOST= (vazio) no .env e removendo este serviço.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav # assinaturas persistidas entre reinícios

  # Serviço dedicado do Docling — permanente e SÓ na rede interna (sem `ports`).
  # O backend o alcança por http://docling-service:8000. Ligue com DOCLING_ENABLED=true.
  docling-service:
    build: ./docling-service
    profiles: ["docling"]
    restart: unless-stopped
    environment:
      - DOCLING_INTERNAL_TOKEN=${DOCLING_INTERNAL_TOKEN:-}
      - DOCLING_CONCURRENCY=${DOCLING_CONCURRENCY:-2}
      - DOCLING_MAX_FILE_MB=${DOCLING_MAX_FILE_MB:-50}
      - DOCLING_MAX_PAGES=${DOCLING_MAX_PAGES:-600}
      - DOCLING_ARTIFACTS_PATH=/models
    volumes:
      - docling_models:/models
    mem_limit: ${DOCLING_MEM_LIMIT:-4g}
    cpus: ${DOCLING_CPUS:-2}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  backend:
    build: .
    restart: unless-stopped
    # SEM "ports": o backend só é alcançável pelo proxy (web), nunca direto.
    env_file:
      - .env
    environment:
      - WORKSPACE_ROOT=/app/workspaces
      - HOST_WORKSPACE_ROOT=${PWD}/workspaces
      - DATA_DIR=/app/data
      - DATABASE_URL=postgres://studio:studio@postgres:5432/studio
      # Docling (camada de documentos) — desligado por padrão.
      - DOCLING_ENABLED=${DOCLING_ENABLED:-false}
      - DOCLING_SERVICE_URL=http://docling-service:8000
      - DOCLING_INTERNAL_TOKEN=${DOCLING_INTERNAL_TOKEN:-}
      - DOCLING_CACHE_ROOT=/app/data/docling-cache
      # Antivírus ligado por padrão (serviço 'clamav' acima). Para desativar,
      # defina CLAMAV_HOST= (vazio) no .env.
      - CLAMAV_HOST=${CLAMAV_HOST-clamav}
      # Origem pública do app: base dos cookies de sessão e dos callbacks OAuth.
      # Se não estiver no .env, é derivada do DOMAIN (https://SEU_DOMINIO).
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://${DOMAIN}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspaces:/app/workspaces
      - ./data:/app/data
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      # node com fetch nativo (a imagem não tem curl/wget)
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}
      # Com DOMAIN definido vira "www.DOMAIN" (certificado + redirect no Caddy);
      # sem DOMAIN vira "localhost:8099" (bloco inerte, porta não exposta).
      - WWW_DOMAIN=${DOMAIN:+www.}${DOMAIN:-localhost:8099}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  clamav_db:
  docling_models:
