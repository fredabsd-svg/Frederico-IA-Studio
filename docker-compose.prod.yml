# PRODUÇÃO (VPS): docker compose -f docker-compose.prod.yml up -d --build
# Requer no .env: DEEPSEEK_API_KEY, APP_PASSWORD e DOMAIN (ex.: app.seusite.com.br)
services:
  sandbox-image:
    build: ./sandbox
    image: frederico-ai-sandbox:latest
    command: ["true"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=studio
      - POSTGRES_PASSWORD=studio
      - POSTGRES_DB=studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    # SEM "ports": o backend só é alcançável pelo proxy (web), nunca direto.
    env_file:
      - .env
    environment:
      - WORKSPACE_ROOT=/app/workspaces
      - HOST_WORKSPACE_ROOT=${PWD}/workspaces
      - DATA_DIR=/app/data
      - DATABASE_URL=postgres://studio:studio@postgres:5432/studio
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspaces:/app/workspaces
      - ./data:/app/data
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
